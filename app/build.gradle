plugins {
    id 'com.android.application'
}

// ── اعلانِ فوری: Metrix ──────────────────────────────────────────────────────────
//
// Metrix's notification module is a wrapper over Firebase Cloud Messaging, so turning push on
// needs three things that are not code: a Firebase project, its app/google-services.json, and
// the two ids from the Metrix panel.
//
// All three are switched on by the presence of that one file. Without it the google-services
// plugin fails the build outright («File google-services.json is missing»), which would mean
// nobody could build the app at all until the file existed — so the plugin, the SDK and the
// manifest entries all come in together, only when it is there.
//
// So: drop app/google-services.json in, put the two Metrix ids in local.properties (or pass
// METRIX_APP_ID / METRIX_SIGNATURE in the environment), and the next build has push. Leave it
// out and the app builds exactly as before, with the in-app notices and nothing else.
def metrixConfig = new Properties()
def localProps = rootProject.file('local.properties')
if (localProps.exists()) localProps.withInputStream { metrixConfig.load(it) }

def metrixAppId = System.getenv('METRIX_APP_ID') ?: metrixConfig.getProperty('metrix.appId', '')
def metrixSignature = System.getenv('METRIX_SIGNATURE') ?: metrixConfig.getProperty('metrix.signature', '')
def firebaseConfig = file('google-services.json')
def pushReady = firebaseConfig.exists() && metrixAppId && metrixSignature

if (pushReady) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle("")
    logger.lifecycle("  ℹ  اعلانِ فوری خاموش است — " + (firebaseConfig.exists()
        ? "app/google-services.json هست ولی metrix.appId/metrix.signature داده نشده."
        : "app/google-services.json نیست."))
    logger.lifecycle("     خبرها همچنان از notices.json می‌آیند، ولی وقتی اپ باز شود، نه همان لحظه.")
    logger.lifecycle("")
}

// Single source of truth for the version: the VERSION file at the repo root.
// versionCode is derived from it so it always climbs with the name.
def appVersionName = rootProject.file('VERSION').exists()
    ? rootProject.file('VERSION').text.trim()
    : '0.0.1'
def (vMajor, vMinor, vPatch) = (appVersionName.tokenize('.') + ['0', '0', '0'])[0..2]*.toInteger()

android {
    namespace 'com.hoohoomath.app'
    compileSdk 34

    // One key for every build, or the app cannot be updated.
    //
    // Each CI run used to make its own throwaway debug key, so every APK was signed by a
    // different hand and Android refused to install one over the last: «نصب نشد» on any phone
    // that already had the app, with no way out but uninstalling and losing the child's
    // progress. Three releases went out with three different certificates before it showed up.
    //
    // The key itself is never in the repo. It arrives from the environment — the workflow
    // writes it from a GitHub secret — and when it is absent the build falls back to the debug
    // key and says so, loudly, so an unsignable build is never mistaken for a publishable one.
    def keystoreFile = System.getenv('HOOHOO_KEYSTORE')
    def keystorePassword = System.getenv('HOOHOO_KEYSTORE_PASSWORD')
    def keyAliasName = System.getenv('HOOHOO_KEY_ALIAS') ?: 'hoohoo'
    def keystoreReady = keystoreFile && keystorePassword && file(keystoreFile).exists()

    if (!keystoreReady) {
        logger.warn("")
        logger.warn("  ⚠  هیچ کلیدِ ثابتی داده نشده — این APK با کلیدِ موقتِ debug امضا می‌شود")
        logger.warn("     و روی گوشی‌ای که نسخه‌ی قبلی را دارد نصب نمی‌شود.")
        logger.warn("     رازِ HOOHOO_KEYSTORE_B64 را در Settings → Secrets بگذار.")
        logger.warn("")
    }

    signingConfigs {
        hoohoo {
            if (keystoreReady) {
                storeFile file(keystoreFile)
                storeType 'PKCS12'
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword System.getenv('HOOHOO_KEY_PASSWORD') ?: keystorePassword
                enableV1Signing true   // some sideloading tools still look for the old signature
                enableV2Signing true
            }
        }
    }

    // AGP 8 builds no AIDL unless asked. The store's billing interface is an .aidl file, so
    // without this the generated IInAppBillingService simply does not exist and nothing compiles.
    // buildConfig likewise: without it there is no BuildConfig.ENFORCE_LOCKS to read.
    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.hoohoomath.app"
        minSdk 26
        targetSdk 34
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersionName

        // Read by the <meta-data> entries in the manifest. Empty when push is off, which is
        // harmless: the SDK is not in the APK either, so nothing reads them.
        manifestPlaceholders = [
            metrixAppId    : metrixAppId ?: '',
            metrixSignature: metrixSignature ?: '',
        ]
    }

    // What is locked, and when.
    //
    // A debug build opens everything: developing or testing a chapter should not mean buying it
    // again on every phone, and the lock is not what is being tested. A release build enforces
    // it. That line is the only difference between the two — the rules themselves live in
    // data/Access.java either way.
    //
    // Which makes the build type load-bearing: whatever ships to کافه‌بازار must be the release
    // build, and the workflow builds assembleRelease for exactly that reason.
    buildTypes {
        debug {
            buildConfigField "boolean", "ENFORCE_LOCKS", "false"
            if (keystoreReady) signingConfig signingConfigs.hoohoo
        }
        release {
            buildConfigField "boolean", "ENFORCE_LOCKS", "true"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unlike debug, a release build is not signed with anything by default — it would
            // come out as app-release-unsigned.apk and install nowhere. So when the real key is
            // not around, it falls back to the debug one: still the wrong key for an update,
            // but an APK someone can actually install, and the build already says so loudly.
            signingConfig keystoreReady ? signingConfigs.hoohoo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.core:core:1.13.1'

    // Push, only in a build that has somewhere to send it. The notification module pulls
    // ir.metrix:core and ir.metrix:lifecycle itself, so attribution and analytics — which exist
    // to profile installs, and have no business in a child's maths app — stay out.
    if (pushReady) {
        implementation 'ir.metrix.notification:metrix:2.9.0'
        implementation platform('com.google.firebase:firebase-bom:33.5.1')
    }
}
