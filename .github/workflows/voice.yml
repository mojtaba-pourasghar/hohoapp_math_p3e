name: ساخت صدای هوهو

# Generates a voice file for every line in res/raw/audio_manifest.txt and commits them,
# so the lessons ship with a real recorded narration instead of the device's own voice.
# Run it by hand from the Actions tab whenever the lesson text changes.

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'صدا'
        default: 'fa-IR-DilaraNeural'
        type: choice
        options:
          - fa-IR-DilaraNeural
          - fa-IR-FaridNeural
      rate:
        description: 'سرعت گفتار'
        default: '-8%'
      force:
        description: 'فایل‌های موجود هم دوباره ساخته شوند'
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts and ffmpeg
        run: |
          python -m pip install --quiet edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate the narration
        run: |
          python3 tools/make_voice.py \
            --voice "${{ inputs.voice }}" \
            --rate "${{ inputs.rate }}" \
            ${{ inputs.force && '--force' || '' }}

      - name: Commit the audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/raw/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          count=$(git diff --cached --name-only | grep -c 'res/raw/' || true)
          git commit -m "صدای هوهو: $count فایل گفتار با ${{ inputs.voice }}"
          git push
