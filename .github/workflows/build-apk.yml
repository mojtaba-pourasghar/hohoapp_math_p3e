name: ساخت APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Name the APK
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/hoohoo-math-${GITHUB_SHA::7}.apk"
          echo "path=out/hoohoo-math-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoohoo-math-apk
          path: out/*.apk
          retention-days: 30

      # A "latest" pre-release so the APK can be downloaded from the Releases page
      # without signing in to GitHub — handy for installing straight onto a tablet.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.apk.outputs.path }}" \
            --title "آخرین نسخه‌ی APK" \
            --notes "ساخته‌شده از کامیت ${GITHUB_SHA::7} — نسخه‌ی دیباگ، مستقیم روی گوشی یا تبلت نصب می‌شود." \
            --prerelease
