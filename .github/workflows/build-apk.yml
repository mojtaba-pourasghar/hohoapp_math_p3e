name: ساخت APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Read the version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=hoohoo-math-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "نسخه: $VERSION"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Two names on purpose: a versioned one for the permanent release, and a fixed
      # "hoohoo-math.apk" so the download link on the latest release never changes.
      - name: Collect the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.version.outputs.apk }}"
          cp app/build/outputs/apk/debug/app-debug.apk dist/hoohoo-math.apk
          ls -lh dist/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoohoo-math-${{ steps.version.outputs.version }}
          path: dist/*.apk
          retention-days: 30

      # The built APK is committed to the repo (dist/) so it can be grabbed straight
      # from the file tree, and tagged as a release so every version stays downloadable.
      - name: Commit the APK into the repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/hoohoo-math.apk
          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "APK نسخه‌ی ${{ steps.version.outputs.version }}"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Tag and publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          NOTES="نسخه‌ی $V — ساخته‌شده از ${GITHUB_SHA::7}. نسخه‌ی دیباگ، مستقیم روی گوشی یا تبلت نصب می‌شود."

          # a permanent release per version…
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "dist/${{ steps.version.outputs.apk }}" --clobber
          else
            gh release create "v$V" "dist/${{ steps.version.outputs.apk }}" \
              --title "نسخه‌ی $V" --notes "$NOTES"
          fi

          # …and the fixed address the app is always published to:
          #   github.com/<repo>/releases/tag/latest
          #   github.com/<repo>/releases/download/latest/hoohoo-math.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            dist/hoohoo-math.apk "dist/${{ steps.version.outputs.apk }}" \
            --title "آخرین نسخه ($V)" --notes "$NOTES" --prerelease
